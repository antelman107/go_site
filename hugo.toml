baseURL = 'https://golangforall.com'
languageCode = 'en-us'
title = 'Golang for all'
theme = 'my'
defaultContentLanguage = 'en'

# Site description for SEO (used in meta tags and Open Graph)
# description = 'Golang for all - Articles about Go programming language'

# Twitter username (optional, format: @username)
# twitter = '@yourusername'

[languages]
  [languages.en]
    weight = 1
    languageCode = 'en-us'
  [languages.ru]
    weight = 2
    languageCode = 'ru-ru'

# Hugo >= 0.162 denies HTML content files by default (GHSA-c54g-xjwj-8g82).
# About pages are trusted .html files under /content; allow them to build.
[security]
  allowContent = ['.*']
